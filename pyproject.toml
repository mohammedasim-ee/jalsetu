[project]
name = "jalsetu"
version = "2.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
# style-only rules relaxed on purpose: compact one-line statements and long lines in data-heavy code
ignore = ["E501", "E701", "E702", "E731", "E741", "B008", "B905", "S101", "S311", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E402"]
"ml/tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["app", "pipeline", "ml/features.py", "ml/export.py"]

[tool.pytest.ini_options]
testpaths = ["tests", "ml/tests"]
addopts = "-p no:cacheprovider"
